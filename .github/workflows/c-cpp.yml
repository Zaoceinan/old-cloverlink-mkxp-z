name: Build with CMake Fix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: source

    - name: Patch physfs CMakeLists.txt
      run: |
        $physfsPath = "source/windows/downloads/ucrt64/physfs/CMakeLists.txt"
        
        # 检查文件是否存在
        if (-not (Test-Path $physfsPath)) {
          Write-Error "physfs CMakeLists.txt not found at $physfsPath"
          exit 1
        }
        
        # 备份原始文件
        Copy-Item $physfsPath "$physfsPath.bak"
        
        # 替换 cmake_minimum_required 命令
        (Get-Content $physfsPath) -replace 'cmake_minimum_required\(VERSION [0-9\.]+\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content $physfsPath
        
        # 验证修改
        Write-Host "Patched content:"
        Get-Content $physfsPath | Select-String "cmake_minimum_required"

    - name: Install dependencies
      run: |
        choco install cmake -y
        choco install ninja -y

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ../source `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
          -G "Ninja"

    - name: Build project
      working-directory: ./build
      run: |
        cmake --build . --config Release

    - name: Verify build
      run: |
        if (Test-Path "Release/*.exe") {
          echo "Build successful!"
        } else {
          echo "Build failed!"
          exit 1
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: build/Release/*.exe
