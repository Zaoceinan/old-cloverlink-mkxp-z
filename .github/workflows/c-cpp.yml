name: Build old-cloverlink-mkxp-z

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build-type: [Release, Debug]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          meson \
          pkg-config \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-ttf-dev \
          libsdl2-mixer-dev \
          libpng-dev \
          libjpeg-dev \
          libwebp-dev \
          libogg-dev \
          libvorbis-dev \
          libopenal-dev \
          libboost-all-dev \
          zlib1g-dev \
          libicu-dev

    - name: Install newer FreeType from source (≥2.12.0)
      run: |
        # 下载并安装 FreeType 2.13.0
        wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.13.0.tar.gz
        tar -xzf freetype-2.13.0.tar.gz
        cd freetype-2.13.0
        mkdir build && cd build
        meson setup .. \
          --prefix=/usr/local \
          --buildtype=release \
          --default-library=both \
          -Dzlib=system \
          -Dbrotli=disabled \
          -Dpng=disabled \
          -Dbzip2=disabled \
          -Dtests=disabled
        ninja
        sudo ninja install
        sudo ldconfig
        
        # 验证安装
        echo "Installed FreeType version:"
        freetype-config --version

    - name: Create build directory
      run: |
        mkdir -p build

    - name: Configure CMake
      working-directory: ./build
      run: |
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_INSTALL_PREFIX=./install \
          -DFREETYPE_INCLUDE_DIRS=/usr/local/include/freetype2 \
          -DFREETYPE_LIBRARY=/usr/local/lib/libfreetype.so

    - name: Build project
      working-directory: ./build
      run: |
        make -j$(nproc)

    - name: Run tests (if any)
      working-directory: ./build
      run: |
        ctest --output-on-failure

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mkxp-z-build-${{ matrix.build-type }}-${{ github.sha }}
        path: |
          build/mkxp-z
          build/*.so*
        retention-days: 7

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install vcpkg dependencies
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat
        ./vcpkg/vcpkg install sdl2 sdl2-image sdl2-ttf sdl2-mixer libpng libjpeg-turbo libwebp openal-soft freetype libogg libvorbis zlib

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build project
      working-directory: ./build
      run: |
        cmake --build . --config ${{ matrix.build-type }} --parallel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mkxp-z-windows-${{ matrix.build-type }}-${{ github.sha }}
        path: |
          build/${{ matrix.build-type }}/*.exe
          build/${{ matrix.build-type }}/*.dll
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install cmake pkg-config sdl2 sdl2_image sdl2_ttf sdl2_mixer libpng libjpeg webp freetype libogg libvorbis openal-soft

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

    - name: Build project
      working-directory: ./build
      run: |
        make -j$(sysctl -n hw.ncpu)

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mkxp-z-macos-${{ matrix.build-type }}-${{ github.sha }}
        path: |
          build/mkxp-z
          build/*.dylib
        retention-days: 7
