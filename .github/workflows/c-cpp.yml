name: Windows Build with CMake Fix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: source

    - name: Patch physfs CMakeLists.txt
      run: |
        # 确保路径正确
        $physfsPath = "source/windows/downloads/ucrt64/physfs/CMakeLists.txt"
        
        # 检查文件是否存在
        if (-not (Test-Path $physfsPath)) {
          # 尝试备用路径
          $physfsPath = "source/external/physfs/CMakeLists.txt"
          if (-not (Test-Path $physfsPath)) {
            Write-Error "physfs CMakeLists.txt not found!"
            exit 1
          }
        }
        
        Write-Host "Patching file: $physfsPath"
        
        # 备份原始文件
        Copy-Item $physfsPath "$physfsPath.bak"
        
        # 替换 cmake_minimum_required 命令
        $content = Get-Content $physfsPath -Raw
        $newContent = $content -replace 'cmake_minimum_required\(VERSION [0-9\.]+\)', 'cmake_minimum_required(VERSION 3.5)'
        
        # 如果替换失败，尝试其他模式
        if ($newContent -eq $content) {
          $newContent = $content -replace 'cmake_minimum_required\s*\(.*?\)', 'cmake_minimum_required(VERSION 3.5)'
        }
        
        Set-Content -Path $physfsPath -Value $newContent
        
        # 验证修改
        Write-Host "Patched content:"
        Get-Content $physfsPath | Select-String "cmake_minimum_required"

    - name: Install build tools
      run: |
        # 安装最新版 CMake
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y
        
        # 验证 CMake 版本
        cmake --version

    - name: Configure CMake with policy override
      run: |
        mkdir build
        cd build
        cmake ../source `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
          -G "Ninja"

    - name: Build project
      working-directory: ./build
      run: |
        cmake --build . --config Release

    - name: Verify build output
      run: |
        if (Test-Path "build/*.exe") {
          echo "Build successful!"
          Get-ChildItem "build"
        } else {
          echo "Build failed - no executables found!"
          exit 1
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-${{ github.sha }}
        path: build/*.exe
        retention-days: 7
