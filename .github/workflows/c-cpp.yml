name: Build with CMake Fix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [Release, Debug]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Patch CMakeLists.txt files
      run: |
        # 查找并修复所有 CMakeLists.txt 文件
        find . -name CMakeLists.txt | while read file; do
          echo "Patching $file..."
          # 替换 cmake_minimum_required 命令
          sed -i 's/cmake_minimum_required(VERSION [0-9]\+\.[0-9]\+)/cmake_minimum_required(VERSION 3.5)/g' "$file"
          sed -i 's/cmake_minimum_required(VERSION [0-9]\+\.[0-9]\+\.[0-9]\+)/cmake_minimum_required(VERSION 3.5)/g' "$file"
        done
        
        # 特殊修复 physfs 的 CMakeLists.txt
        if [ -f "windows/downloads/ucrt64/physfs/CMakeLists.txt" ]; then
          sed -i 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.5)/' "windows/downloads/ucrt64/physfs/CMakeLists.txt"
        fi

    - name: Install dependencies
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev libfreetype-dev
        elif [ "$RUNNER_OS" == "Windows" ]; then
          choco install cmake -y
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install cmake sdl2 freetype
        fi

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Build project
      working-directory: ./build
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          cmake --build . --config ${{ matrix.build-type }} --parallel
        else
          make -j$(nproc)
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.build-type }}
        path: build/
