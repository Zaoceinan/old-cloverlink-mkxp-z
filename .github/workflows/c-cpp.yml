name: Build old-cloverlink-mkxp-z (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install vcpkg dependencies
      run: |
        # 安装最新版 CMake
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        
        # 设置 vcpkg
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        
        # 安装依赖库
        .\vcpkg install sdl2 sdl2-image sdl2-ttf sdl2-mixer libpng libjpeg-turbo libwebp openal-soft freetype libogg libvorbis zlib physfs
        
        # 添加 vcpkg 到环境变量
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
        echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
        echo "PATH=$env:GITHUB_WORKSPACE\vcpkg;$env:PATH" >> $env:GITHUB_ENV

    - name: Patch CMakeLists.txt for CMake compatibility
      run: |
        # 修复顶层 CMakeLists.txt
        $topCMake = "CMakeLists.txt"
        if (Test-Path $topCMake) {
            (Get-Content $topCMake) -replace 'cmake_minimum_required\(VERSION [0-9\.]+\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content $topCMake
        }
        
        # 修复 physfs 的 CMakeLists.txt
        $physfsCMake = "windows\downloads\ucrt64\physfs\CMakeLists.txt"
        if (Test-Path $physfsCMake) {
            (Get-Content $physfsCMake) -replace 'cmake_minimum_required\(VERSION [0-9\.]+\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content $physfsCMake
        }
        
        # 修复其他可能存在的 CMakeLists.txt 文件
        Get-ChildItem -Recurse -Filter CMakeLists.txt | ForEach-Object {
            $content = Get-Content $_.FullName
            $newContent = $content -replace 'cmake_minimum_required\(VERSION [0-9\.]+\)', 'cmake_minimum_required(VERSION 3.5)'
            if ($newContent -ne $content) {
                Set-Content -Path $_.FullName -Value $newContent
                Write-Host "Patched: $($_.FullName)"
            }
        }

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" `
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
          -G "Visual Studio 17 2022" -A x64
      env:
        BUILD_TYPE: ${{ matrix.build-type }}

    - name: Build project
      working-directory: ./build
      run: |
        cmake --build . --config $env:BUILD_TYPE --parallel

    - name: Run tests (if any)
      working-directory: ./build
      run: |
        ctest -C $env:BUILD_TYPE --output-on-failure

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mkxp-z-windows-${{ matrix.build-type }}-${{ github.sha }}
        path: |
          build/${{ matrix.build-type }}/*.exe
          build/${{ matrix.build-type }}/*.dll
        retention-days: 7
